  json_annotation: ^4.12.0
  logging: ^1.3.0
  meta: ^1.18.0
  shelf: ^1.4.2
  yaon: ^2.0.2

dev_dependencies:
  build_runner: ^2.16.0
  embed: ^1.6.6
  ilt_lints: ^1.0.0+1
  json_serializable: ^6.14.1
  test: ^1.31.2
