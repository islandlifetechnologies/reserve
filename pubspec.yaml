name: 'reserve'
description: 'Server that can forward requests from one location to another while reprocessing the responses.'
homepage: 'https://github.com/islandlifetechnologies/reserve'
version: 1.0.0

executables: 
  reserve: bin/reserve.dart

environment:
  sdk: ^3.12.0

dependencies:
  archive: ^4.0.9
  args: ^2.7.0
  http: ^1.6.0
  http_cookie_parser: ^1.0.0+2
  json_annotation: ^4.12.0
  logging: ^1.3.0
  meta: ^1.18.0
  shelf: ^1.4.2
  template_expressions: ^4.0.2
  yaon: ^2.0.2

dev_dependencies:
  build_runner: ^2.16.0
  ilt_lints: ^1.0.0+1
  json_serializable: ^6.14.1
  test: ^1.31.2

dependency_overrides:
  template_expressions:
    path: ../template_expressions